name: Build downloadable IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: velocity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Unit tests
        run: xcodebuild test -project Velocity.xcodeproj -scheme Velocity -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
      - name: Build device app
        run: |
          xcodebuild -project Velocity.xcodeproj -scheme Velocity -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA for external signing
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/Velocity.app output/Payload/
          test -f output/Payload/Velocity.app/Velocity
          cd output
          zip -qry Velocity-unsigned.ipa Payload
          shasum -a 256 Velocity-unsigned.ipa > Velocity-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Velocity-IPA
          path: |
            output/Velocity-unsigned.ipa
            output/Velocity-unsigned.ipa.sha256
      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" output/Velocity-unsigned.ipa output/Velocity-unsigned.ipa.sha256 --target "$GITHUB_SHA" --title "Velocity 1.0 · Build ${GITHUB_RUN_NUMBER}" --notes "Unsigned iOS IPA. Sign with your own valid certificate in GBox or another signing tool before installation. GPS requires Location permission."
