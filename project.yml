name: Velocity
options:
  bundleIdPrefix: com.berkecaan
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Velocity:
    type: application
    platform: iOS
    sources: [Velocity]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berkecaan.velocity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Velocity/Info.plist
      properties:
        CFBundleDisplayName: Velocity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: GPS hızınızı, mesafeyi ve sürüş rotanızı göstermek için konumunuz kullanılır. Veriler yalnızca cihazınızda saklanır.
        UIRequiresFullScreen: true
  VelocityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VelocityTests]
    dependencies:
      - target: Velocity
schemes:
  Velocity:
    build:
      targets:
        Velocity: all
        VelocityTests: [test]
    test:
      targets: [VelocityTests]
